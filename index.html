<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error detected</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #000000;
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .termination-container {
            max-width: 600px;
        }

        .sad-face {
            font-size: 72px;
            font-weight: 700;
            margin-bottom: 20px;
            line-height: 1;
        }

        .message {
            font-size: 20px;
            font-weight: 500;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .footer-text {
            font-size: 14px;
            font-weight: 400;
            color: #aaaaaa;
        }
    </style>
</head>
<body>

    <div class="termination-container">
        <div class="sad-face">:(</div>
        <p class="message">Sorry, This website is no longer available as the owner has terminated the functions</p>
        <p class="footer-text">Powered by Exo Hub</p>
    </div>

</body>
</html>
